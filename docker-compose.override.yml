services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  discountdb:
    container_name: discountdb
    image: postgres:17
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pa55w0rd!
      - POSTGRES_DB=DiscountDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
 

  orderdb:
    container_name: orderdb
    restart: always
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=pa55w0rd!
    volumes:
      - orderdb_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P pa55w0rd! -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 3

  identitydb:
    container_name: identitydb
    restart: always
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=pa55w0rd!
    volumes:
      - identitydb_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P pa55w0rd! -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  pgadmin:
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@eCommerce.net
      - PGADMIN_DEFAULT_PASSWORD=pa55w0rd!
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin

  portainer:
    container_name: portainer
    restart: always
    ports:
      - "9080:8000"
      - "9090:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  ## API SECTIONS STARTS
  catalog:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__Connectionstring=mongodb://catalogdb:27017"
      - "DatabaseSettings__DatabaseName=CatalogDb"
      - "DatabaseSetting__ProductCollectionName=Products"
      - "DatabaseSetting__BrandCollectionName=Brands"
      - "DatabaseSetting__TypeCollectionName=Types"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    depends_on:
      - catalogdb
    ports:
      - "8000:8080" #port external mapped to internal
  basket:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__Connectionstring=basketdb:6379"
      - "GrpcSettings__DiscountUrl=http://discount:8080"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    depends_on:
      - basketdb
    ports:
      - "8001:8080" #port external mapped to internal

  discount:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__Connectionstring=Server=discountdb;Port=5432;Database=DiscountDb;User Id=admin;Password=pa55w0rd!;"
      - "GrpcSettings__DiscountUrl=http://discount:8080"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    depends_on:
      - discountdb
    ports:
      - "8002:8080" #port external mapped to internal

  ordering:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__Connectionstring=Server=orderdb;Database=OrderDb;User Id=sa;Password=pa55w0rd!;"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    depends_on:
      - orderdb
      - rabbitmq
    ports:
      - "8003:8080" #port external mapped to internal

  payment:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    ports:
      - "8004:8080" #port external mapped to internal

  identity:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__Connectionstring=Server=identitydb;Database=IdentityDb;User Id=sa;Password=pa55w0rd!;"
      - "Jwt__Key=super_secure_secret_key_1234567890!}{{?"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=eccommerce.clients"
      - "Jwt__DurationInMinutes=60"
      - "ElasticConfiguration__Url=http://elasticsearch:9200"
    depends_on:
      - identitydb
    ports:
      - "8005:8080" #port external mapped to internal

  ocelot.apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "Jwt__Key=super_secure_secret_key_1234567890!}{{?"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=eccommerce.clients"
    depends_on:
      - catalog
      - basket
      - discount
      - ordering
      - payment
      - identity
    ports:
      - "8010:8080" #port external mapped to internal

  elasticsearch:
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
